
<div class="app">
  <h1>Mini Voice AI</h1>
  <p class="subtitle">軽量な音声対話AI</p>

  <div id="status">準備完了</div>

  <div id="chat" class="chat">
    <div class="message bot">
      こんにちは！何を話そうか？
    </div>
  </div>

  <button id="mic">🎤 話しかける</button>
  <button id="stop" class="secondary">読み上げ停止</button>

  <form id="form">
    <input id="input" placeholder="文字でも話しかけられるよ">
    <button type="submit">送信</button>
    <script src="./main.js" defer></script>
  </form>
</div>
