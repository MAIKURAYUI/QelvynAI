
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Voice AI</title>
  <meta name="description" content="軽量な音声対話AI">
  <link rel="stylesheet" href="./style.css">
  <script src="./main.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Mini Voice AI</h1>
    <p class="subtitle">軽量な音声対話AI</p>

    <section class="chat" aria-live="polite">
      <p id="status">準備中...</p>
      <div id="messages"></div>
    </section>

    <div class="controls">
      <button id="micButton" type="button">🎤 話しかける</button>
      <button id="stopButton" type="button">読み上げ停止</button>
    </div>

    <form id="chatForm">
      <input
        id="userInput"
        type="text"
        placeholder="文字でも話しかけられる"
        autocomplete="off"
        aria-label="メッセージ"
      >
      <button type="submit">送信</button>
    </form>
  </main>
</body>
</html>
